services:
  # AG-UI Python agent (LLM) consumed by the Next.js frontend via AGENT_URL.
  - type: web
    name: dynamic-ui-agent
    runtime: python
    rootDir: copilotkit-test/agent
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python src/main.py
    envVars:
      - key: AGENT_RELOAD
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Azure OpenAI credentials (set secrets in the Render dashboard):
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
        value: gpt-4o-mini
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-10-21"
      # Or plain OpenAI instead: unset the Azure vars and set OPENAI_API_KEY
      # (+ optional OPENAI_CHAT_MODEL_ID).
